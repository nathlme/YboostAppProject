<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UHC LoLdle</title>
  <link rel="stylesheet" href="../static/css/ChampPage.css" />
</head>

<body>
<div class="background-zone">
  
    <aside class="sidebar">
      <img class="sidebar-logo" src="../static/images/LOLicon.jpg" alt="LoL" />

      <div class="horizontal-line"></div>

      <nav>
        <a href="/logged">
          <img src="../static/images/HomeIcon.jpg" alt="" />
          <span>Accueil</span>
        </a>

        <a href="/Profil">
          <img src="../static/images/ProfileIcon.jpg" alt="" />
          <span>Profil</span>
        </a>

        <a href="/Champs">
          <img src="../static/images/ChampLogo.jpg" alt="" />
          <span>Champion</span>
        </a>

        <a href="/Items">
          <img src="../static/images/ItemLogo.jpg" alt="" />
          <span>Items</span>
        </a>
      </nav>

      <div class="vertical-line"></div>
    </aside>

    <main class="content">
      <div class="page-brand">
        <span class="brand-small">UHC</span>
        <span class="brand-big">LoLdle</span>
      </div>

      <section class="game-wrapper">
        <div class="intro-box">
          <p class="page-title">Devinez à quel champion de League of legends ce lore appartient ! </p><br><br>
          <p id="lore" class="intro-text">
            {{ .ChampLore}}
          </p>
          <p id="tries" class="hint-text"></p>
        </div>
      
        
        <div class="search-zone">
          <p id="triesDisplay" class="tries-count"></p>
          <div class="search-box">
            <input type="text" id="champInput" placeholder="Choisir un champion..." autocomplete="off">
            <div id="champList"></div>
          </div>

          <div id="try"></div>
        </div>

        <section class="guesses-zone">
          <h2 class="guesses-title">Champions déjà proposés :</h2>
          <div id="guessedHistory" class="guessed-history"></div>
        </section>

        <p class="debug-daily">{{ printf "%q" .ChampionID }}</p>
      </section>
    </main>

    <script src="../static/js/common.js"></script>
    <script>
      const champions = {{ .ChampionsJSON }};
      champions.sort((a, b) => a.name.localeCompare(b.name));
      console.log(champions);

      let guessed = []

      const input = document.getElementById("champInput");
      const list = document.getElementById("champList");
      const guessedHistory = document.getElementById("guessedHistory")

      let tries = 0
      let fullLore = ""

      
      input.addEventListener("input", function() {
        const filtered = FilteredList(champions, input.value);
        renderList(filtered, list, guessed, input, submitGuess);
      });

      input.addEventListener("focus", function() {
        console.log("Input activé");
        renderList(FilteredList(champions, input.value), list, guessed, input, submitGuess);
      });

      input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          const filtered = FilteredList(champions, input.value);
          const closerElmt = filtered.find(champ => !guessed.includes(champ.name));

          if (closerElmt) {
            guessed.push(closerElmt.name);
            submitGuess(closerElmt.name);
            input.value = "";
            renderList([], list, guessed, input, submitGuess);
          }
        }
      }); 

      async function submitGuess(name) {
        const guessedHistory = document.getElementById("guessedHistory")
        
        const response = await fetch("/guess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ champion: name })
        })

        let verify = document.getElementById("try")
        
        const raw = await response.text();
        console.log("status =", response.status);
        console.log("raw response =", raw);

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data = JSON.parse(raw);
        
        const champ = champions.find(c => c.name === name);

        const img = document.createElement("img");
        img.src = champ.imageUrl;
        img.alt = champ.name;

        const span = document.createElement("span");
        span.textContent = champ.name;
        
        if (data.correct) {
            input.style.display = "none"
            list.style.display = "none" 

            verify.textContent = `Bien joué ! C'était ${champ.name}`
            console.log("le bon")
            
            let alreadyGuess = document.createElement("div")
            alreadyGuess.classList.add("guess-row")
            alreadyGuess.classList.add("true")
            alreadyGuess.appendChild(img)
            alreadyGuess.appendChild(span)
            guessedHistory.prepend(alreadyGuess)
            tries++
            updateHint()
        
        }else {
          verify.textContent = `${champ.name} n'est pas le bon champion`

          let alreadyGuess = document.createElement("div")

          alreadyGuess.classList.add("guess-row")
          alreadyGuess.classList.add("false")

          alreadyGuess.appendChild(img)
          alreadyGuess.appendChild(span)

          guessedHistory.prepend(alreadyGuess)
          tries++
          updateHint()
        }
        
      } 


      window.onload = () => {
          const loreElement = document.getElementById("lore")
          fullLore = loreElement.textContent
          updateHint()
      }

    function firstInt(lore) {
        let limit = Math.floor(lore.length / 3)
        let result = ""

        for (let i = 0; i < lore.length; i++) {
            if (i < limit) {
                result += lore[i]
            } else {
                if (lore[i] === " ") {
                    result += " "
                } else {
                    result += "*"
                }
            }
        }

        return result
    }

function secondInt(lore) {
    let limit = Math.floor(lore.length / 2)
    let result = ""

    for (let i = 0; i < lore.length; i++) {
        if (i < limit) {
            result += lore[i]
        } else {
            if (lore[i] === " ") {
                result += " "
            } else {
                result += "*"
            }
        }
    }

    return result
}

    function updateHint() {
        let displayLore = ""
        let FirstIntCount = 3 - tries
        let SecondIntCount = 6 - tries
        let message = ""

        if (tries <= 2) {
            displayLore = firstInt(fullLore)
            message = `Premier indice dans ${FirstIntCount} essais`
            document.getElementById("tries").textContent = message
        } else if (tries <= 5) {
            displayLore = secondInt(fullLore)
            message = `Dernier indice dans ${SecondIntCount} essais`
            document.getElementById("tries").textContent = message
        } else {
            displayLore = fullLore
            message = "Plus d'indice disponible..."
            document.getElementById("tries").textContent = message
        }

        document.getElementById("lore").textContent = displayLore
        document.getElementById("triesDisplay").textContent = `Essais : ${tries}`
    }
    
    
    </script>

</div>
</body>
</html>
