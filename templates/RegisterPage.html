<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UHC LoLdle - Register</title>
  <link rel="stylesheet" href="../static/css/RegisterPage.css" />
  <link rel="stylesheet" href="../static/css/global.css" />
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <span class="brand-small">UHC</span>
      <span class="brand-big">LoLdle</span>
    </div>

    <form method="POST" action="/register" class="auth-card">
      <h1>Inscription</h1>
      <p class="auth-subtitle">Crée ton compte pour commencer à jouer.</p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Ton email">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="Ton mot de passe">

      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" name="pseudo" placeholder="Ton pseudo">

      <button type="submit">S’inscrire</button>

      <p class="auth-link">
        Déjà un compte ? <a href="/login">Se connecter</a>
      </p>
    </form>
  </div>
</body>
</html>
